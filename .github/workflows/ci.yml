name: CI

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

  # Performance check: benchmarks this commit and the base commit on the same
  # runner, so machine speed cancels out. The steps-per-second cases block
  # above a 10 % regression, confirmed by a second round so a single noisy
  # run cannot fail the job; the snapshot timing only warns.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Benchmark deste commit
        run: npx tsx bench/run.ts head.json
      # Same code twice on the same runner: the difference is pure noise, the
      # false alarms the threshold has to tolerate. Report only.
      - name: Benchmark A/A (mesmo código de novo)
        run: |
          npx tsx bench/run.ts head2.json
          node bench/compare.mjs head2.json head.json "Teste A/A (mesmo código, mesmo runner)" --report-only
      # If the base cannot be prepared, the comparison is skipped (never blocks).
      - name: Benchmark do commit base
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Sem commit base."; exit 0
          fi
          git worktree add ../base "$BASE"
          cd ../base
          if [ ! -f bench/run.ts ]; then echo "O commit base ainda não tem benchmark."; exit 0; fi
          npm ci
          npx tsx bench/run.ts "$GITHUB_WORKSPACE/base.json"
      - name: Comparar (bloqueia acima de 10 % nos passos/s)
        run: |
          if node bench/compare.mjs head.json base.json; then exit 0; fi
          echo "Regressão bloqueante: confirmando com uma segunda rodada de este commit e base."
          npx tsx bench/run.ts head3.json
          (cd ../base && npx tsx bench/run.ts "$GITHUB_WORKSPACE/base3.json")
          node bench/compare.mjs head3.json base3.json "Confirmação (segunda rodada)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark
          path: |
            head.json
            head2.json
            head3.json
            base.json
            base3.json
          if-no-files-found: ignore
